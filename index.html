<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topper Study Hub - Neon Portal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0f18;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(18, 22, 38, 0.85);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2);
            border: 1px solid rgba(0, 243, 255, 0.4);
            backdrop-filter: blur(12px);
        }
        .screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        h2 {
            color: #00f3ff;
            margin-bottom: 8px;
            font-size: 28px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .subtitle {
            color: #a0aec0;
            font-size: 14px;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #00f3ff;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            font-size: 15px;
            background: #1a1f35;
            color: #fff;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            border-color: #00f3ff;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-neon {
            background: linear-gradient(135deg, #00f3ff 0%, #0066ff 100%);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            margin-bottom: 15px;
        }
        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
            transform: translateY(-2px);
        }
        .google-btn {
            background: #1a1f35;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .google-btn:hover {
            background: #252b48;
            border-color: #fff;
        }
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            position: relative;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* Dashboard Styles */
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        .logout-btn {
            background: #ff3366;
            color: white;
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.4);
        }
        .logout-btn:hover {
            box-shadow: 0 0 18px rgba(255, 51, 102, 0.8);
        }
        .content-box {
            background: #1a1f35;
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .action-btns button {
            margin-top: 12px;
            color: #fff;
        }
        .btn-notes { background: #00b894; box-shadow: 0 0 10px rgba(0, 184, 148, 0.3); }
        .btn-obj { background: #0984e3; box-shadow: 0 0 10px rgba(9, 132, 227, 0.3); }
        .btn-sub { background: #e17055; box-shadow: 0 0 10px rgba(225, 112, 85, 0.3); }
        
        .back-btn {
            background: #636e72;
            color: white;
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        ul.chapter-list {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        ul.chapter-list li {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- 1. NEON LOGIN SCREEN -->
        <div id="login-screen" class="screen active-screen">
            <h2>TOPPER STUDY HUB</h2>
            <p class="subtitle">⚡ NCERT Advanced Neon Portal ⚡</p>
            
            <label for="email">Email ID</label>
            <input type="email" id="email" placeholder="student@gmail.com">
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••">
            
            <button class="btn-neon" id="login-btn">LOGIN</button>

            <div class="divider">OR</div>

            <button class="google-btn" onclick="performLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.83 2.71v2.26h2.96c1.73-1.59 2.73-3.93 2.73-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.96-2.26c-.82.55-1.87.88-3 .88-2.32 0-4.28-1.57-4.99-3.68H1.01v2.33C2.51 15.96 5.51 18 9 18z"/><path fill="#FBBC05" d="M4.01 10.76c-.19-.55-.29-1.14-.29-1.76s.1-1.21.29-1.76V4.91H1.01C.37 6.18 0 7.55 0 9s.37 2.82 1.01 4.09l3-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.47.89 11.43 0 9 0 5.51 0 2.51 2.04 1.01 4.91l3 2.33c.71-2.11 2.67-3.66 4.99-3.66z"/></svg>
                Sign in with Google
            </button>
        </div>

        <!-- 2. DASHBOARD SCREEN -->
        <div id="dashboard-screen" class="screen">
            <div class="header-flex">
                <h3 style="color: #00f3ff; font-size: 18px;" id="dash-title">NCERT Portal</h3>
                <button class="logout-btn" onclick="performLogout()">Logout</button>
            </div>

            <label for="class-select">कक्षा चुनें (Select Class):</label>
            <select id="class-select" onchange="onClassChange(this.value)">
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11" selected>Class 11</option>
                <option value="12">Class 12</option>
            </select>

            <label for="subject-select">विषय चुनें (Select Subject):</label>
            <select id="subject-select" onchange="onSubjectChange(this.value)">
                <!-- Dynamically loaded subjects -->
            </select>

            <div class="content-box action-btns">
                <h4 style="margin-bottom: 12px; color: #00f3ff;">अध्ययन सामग्री (Study Material)</h4>
                <button class="btn-notes" onclick="openSection('notes')">📄 Chapters & Notes</button>
                <button class="btn-obj" onclick="openSection('objective')">❓ Objective Questions</button>
                <button class="btn-sub" onclick="openSection('subjective')">📝 Subjective Questions</button>
            </div>
        </div>

        <!-- 3. CONTENT DISPLAY SCREEN -->
        <div id="content-screen" class="screen">
            <button class="back-btn" onclick="goBackToDashboard()">← Back</button>
            <h3 id="section-title" style="color: #00f3ff; margin-bottom: 12px;">Title</h3>
            <div class="content-box" id="section-content-body" style="line-height: 1.6; color: #fff;">
                <!-- Content loaded here -->
            </div>
        </div>

    </div>

    <script>
        // Aapka pura ncertData yahan integrated hai
        const ncertData = {
            6: {
                science: ["Chapter 1: Food: Where Does It Come From?", "Chapter 2: Components of Food", "Chapter 3: Fibre to Fabric"],
                mathematics: ["Chapter 1: Knowing Our Numbers", "Chapter 2: Whole Numbers", "Chapter 3: Playing with Numbers"],
                social_science: ["History Ch 1: What, Where, How and When?", "Geography Ch 1: The Earth in the Solar System"],
                hindi: ["Chapter 1: कलम का सिपाही", "Chapter 2: झाँसी की रानी"],
                english: ["Chapter 1: Who Did Patrick's Homework?", "Chapter 2: How the Dog Found Himself"]
            },
            7: {
                science: ["Chapter 1: Nutrition in Plants", "Chapter 2: Nutrition in Animals"],
                mathematics: ["Chapter 1: Integers", "Chapter 2: Fractions and Decimals"],
                social_science: ["History Ch 1: Tracing Changes", "Geography Ch 1: Environment"],
                hindi: ["Chapter 1: हम पंछी उन्मुक्त गगन के"],
                english: ["Chapter 1: Three Questions", "Chapter 2: A Gift of Chappals"]
            },
            8: {
                science: ["Chapter 1: Crop Production", "Chapter 2: Microorganisms"],
                mathematics: ["Chapter 1: Rational Numbers", "Chapter 2: Linear Equations"],
                social_science: ["History Ch 1: How, When and Where", "Geography Ch 1: Resources"],
                hindi: ["Chapter 1: ध्वनि", "Chapter 2: लाख की चूड़ियाँ"],
                english: ["Chapter 1: The Best Christmas Present"]
            },
            9: {
                science: ["Chapter 1: Matter in Our Surroundings", "Chapter 2: Is Matter Around Us Pure?"],
                mathematics: ["Chapter 1: Number Systems", "Chapter 2: Polynomials"],
                social_science: ["History Ch 1: The French Revolution", "Geography Ch 1: India – Size and Location"],
                hindi: ["Chapter 1: दो बैलों की कथा", "Chapter 2: ल्हासा की ओर"],
                english: ["Chapter 1: The Fun They Had"]
            },
            10: {
                science: ["Chapter 1: Chemical Reactions and Equations", "Chapter 2: Acids, Bases and Salts"],
                mathematics: ["Chapter 1: Real Numbers", "Chapter 2: Polynomials"],
                social_science: ["History Ch 1: The Rise of Nationalism", "Geography Ch 1: Resources and Development"],
                hindi: ["Chapter 1: सूरदास – पद", "Chapter 2: राम-लक्ष्मण-परशुराम संवाद"],
                english: ["Chapter 1: A Letter to God"]
            },
            11: {
                physics: ["Chapter 1: Physical World", "Chapter 2: Units and Measurements", "Chapter 3: Motion in a Straight Line"],
                chemistry: ["Chapter 1: Some Basic Concepts of Chemistry", "Chapter 2: Structure of Atom"],
                biology: ["Chapter 1: The Living World", "Chapter 2: Biological Classification"],
                mathematics: ["Chapter 1: Sets", "Chapter 2: Relations and Functions"],
                english: ["Chapter 1: The Portrait of a Lady", "Chapter 2: We're Not Afraid to Die"],
                hindi: ["Chapter 1: नमक का दारोगा", "Chapter 2: मियाँ नसीरुद्दीन"]
            },
            12: {
                physics: ["Chapter 1: Electric Charges and Fields", "Chapter 2: Electrostatic Potential"],
                chemistry: ["Chapter 1: Solutions", "Chapter 2: Electrochemistry"],
                biology: ["Chapter 1: Reproduction in Organisms", "Chapter 2: Sexual Reproduction"],
                mathematics: ["Chapter 1: Relations and Functions", "Chapter 2: Inverse Trigonometric Functions"],
                english: ["Chapter 1: The Last Lesson", "Chapter 2: Lost Spring"],
                hindi: ["Chapter 1: भक्तिन", "Chapter 2: बाजार दर्शन"]
            }
        };

        let activeClass = '11';
        let activeSubject = '';

        window.addEventListener('DOMContentLoaded', function () {
            populateSubjectsDropdown();

            if (localStorage.getItem('isLoggedIn') === 'true') {
                showDashboard();
            } else {
                switchScreen('login-screen');
            }

            document.getElementById('login-btn').addEventListener('click', function() {
                const email = document.getElementById('email').value;
                if(email) {
                    performLogin();
                } else {
                    alert('Please enter your email!');
                }
            });
        });

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
            document.getElementById(screenId).classList.add('active-screen');
        }

        function performLogin() {
            localStorage.setItem('isLoggedIn', 'true');
            showDashboard();
        }

        function showDashboard() {
            switchScreen('dashboard-screen');
            populateSubjectsDropdown();
        }

        function performLogout() {
            localStorage.removeItem('isLoggedIn');
            switchScreen('login-screen');
        }

        function onClassChange(value) {
            activeClass = value;
            populateSubjectsDropdown();
        }

        function onSubjectChange(value) {
            activeSubject = value;
        }

        function populateSubjectsDropdown() {
            const subSelect = document.getElementById('subject-select');
            if (!subSelect) return;

            subSelect.innerHTML = '';
            const classSubjects = ncertData[activeClass] || {};
            let firstSub = '';

            for (const subKey in classSubjects) {
                if (!firstSub) firstSub = subKey;
                const option = document.createElement('option');
                option.value = subKey;
                option.textContent = subKey.toUpperCase();
                subSelect.appendChild(option);
            }
            activeSubject = firstSub;
            subSelect.value = firstSub;
        }

        function openSection(type) {
            switchScreen('content-screen');
            const titleEl = document.getElementById('section-title');
            const bodyEl = document.getElementById('section-content-body');

            const classSubjects = ncertData[activeClass] || {};
            const chapters = classSubjects[activeSubject] || [];

            if (type === 'notes') {
                titleEl.textContent = `📄 ${activeSubject.toUpperCase()} - Chapters & Notes`;
                let htmlList = '<ul class="chapter-list">';
                chapters.forEach(ch => {
                    htmlList += `<li>📚 ${ch}</li>`;
                });
                htmlList += '</ul>';
                bodyEl.innerHTML = htmlList;
            } else if (type === 'objective') {
                titleEl.textContent = `❓ ${activeSubject.toUpperCase()} - Objective Questions`;
                bodyEl.innerHTML = `<p>1. Sample MCQ 1 for ${activeSubject}? <br>2. Sample MCQ 2 for ${activeSubject}?</p>`;
            } else if (type === 'subjective') {
                titleEl.textContent = `📝 ${activeSubject.toUpperCase()} - Subjective Questions`;
                bodyEl.innerHTML = `<p>1. Define key concepts and derivations for ${activeSubject}.</p>`;
            }
        }

        function goBackToDashboard() {
            switchScreen('dashboard-screen');
        }
    </script>
</body>
</html>
