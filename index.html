<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topper Study Hub - Bihar Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#070b14,#111827);
    color:#fff;
    min-height:100vh;
}

/* ================= LOGIN ================= */

#login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:440px;
    background:rgba(30,41,59,.95);
    border:1px solid rgba(56,189,248,.2);
    border-radius:24px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.login-card h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:8px;
}

.login-sub{
    text-align:center;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:28px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-size:14px;
}

.form-group input{
    width:100%;
    padding:13px 15px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:#fff;
    outline:none;
    font-size:15px;
}

.form-group input:focus{
    border-color:#38bdf8;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:11px;
    color:white;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.login-btn:hover{
    opacity:.9;
}

/* ================= DASHBOARD ================= */

#dashboard-screen{
    display:none;
    max-width:1250px;
    margin:auto;
    padding:25px;
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    padding-bottom:20px;
    margin-bottom:25px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.dashboard-header h2{
    color:#38bdf8;
    font-size:24px;
}

.controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.controls select{
    background:#1e293b;
    color:#fff;
    border:1px solid #475569;
    padding:10px 13px;
    border-radius:8px;
    outline:none;
    cursor:pointer;
}

.logout-btn{
    border:none;
    background:#ef4444;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

/* ================= MAIN FOLDERS ================= */

#main-view{
    display:block;
}

.section-title{
    font-size:20px;
    font-weight:700;
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:20px;
}

.folder-card{
    background:rgba(30,41,59,.8);
    border:1px solid rgba(255,255,255,.08);
    border-radius:17px;
    padding:25px;
    cursor:pointer;
    transition:.3s;
}

.folder-card:hover{
    transform:translateY(-5px);
    border-color:#38bdf8;
    box-shadow:0 10px 30px rgba(56,189,248,.12);
}

.folder-icon{
    width:58px;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(56,189,248,.1);
    border-radius:13px;
    font-size:32px;
    margin-bottom:15px;
}

.folder-card h3{
    margin-bottom:8px;
}

.folder-card p{
    color:#94a3b8;
    font-size:14px;
}

/* ================= CHAPTER VIEW ================= */

#chapter-view{
    display:none;
}

.top-nav{
    margin-bottom:20px;
}

.back-btn{
    background:#334155;
    color:#fff;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.back-btn:hover{
    background:#475569;
}

.view-title{
    color:#38bdf8;
    font-size:23px;
    margin-bottom:20px;
}

.subject-info{
    background:rgba(30,41,59,.6);
    border:1px solid #334155;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    color:#cbd5e1;
}

.chapter-list{
    display:grid;
    gap:12px;
}

.chapter-card{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    padding:17px;
    cursor:pointer;
    transition:.25s;
}

.chapter-card:hover{
    border-color:#38bdf8;
    background:#243449;
    transform:translateX(3px);
}

.chapter-number{
    min-width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(56,189,248,.12);
    color:#38bdf8;
    border-radius:9px;
    font-weight:700;
}

.chapter-name{
    line-height:1.5;
    color:#f8fafc;
    padding-top:7px;
}

/* ================= CONTENT ================= */

#content-view{
    display:none;
}

.content-box{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:13px;
    padding:20px;
    margin-bottom:15px;
}

.content-box h3{
    color:#38bdf8;
    margin-bottom:12px;
}

.content-text{
    color:#cbd5e1;
    line-height:1.7;
}

/* ================= MCQ ================= */

.mcq-card{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:13px;
    padding:20px;
    margin-bottom:16px;
}

.mcq-question{
    font-weight:700;
    line-height:1.6;
    margin-bottom:15px;
}

.mcq-option{
    width:100%;
    text-align:left;
    padding:12px 14px;
    margin-top:9px;
    border:1px solid #475569;
    border-radius:9px;
    background:#1e293b;
    color:#e2e8f0;
    cursor:pointer;
    transition:.2s;
}

.mcq-option:hover{
    border-color:#38bdf8;
}

.mcq-option.correct{
    background:#166534 !important;
    border-color:#22c55e !important;
    color:white;
}

.mcq-option.wrong{
    background:#991b1b !important;
    border-color:#ef4444 !important;
    color:white;
}

.mcq-option:disabled{
    cursor:default;
}

.result-message{
    margin-top:12px;
    font-weight:700;
}

/* ================= RESPONSIVE ================= */

@media(max-width:650px){

    #dashboard-screen{
        padding:15px;
    }

    .login-card{
        padding:25px;
    }

    .dashboard-header h2{
        font-size:20px;
    }

    .controls{
        width:100%;
    }

    .controls select,
    .logout-btn{
        flex:1;
    }

}
</style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="login-screen">

    <div class="login-card">

        <h1>Topper Study Hub</h1>

        <div class="login-sub">
            Bihar Board & NCERT Study Portal
        </div>

        <div class="form-group">
            <label id="email-label">Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="student@gmail.com">
        </div>

        <div class="form-group">

            <label id="password-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="••••••••">
        </div>

        <button
            class="login-btn"
            onclick="performLogin()"
            id="login-button">

            Access Portal

        </button>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard-screen">

    <div class="dashboard-header">

        <h2 id="dashboard-title">
            Topper Study Hub
        </h2>

        <div class="controls">

            <!-- CLASS -->

            <select
                id="class-select"
                onchange="onClassChange(this.value)">

                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>

            </select>


            <!-- SUBJECT -->

            <select
                id="subject-select"
                onchange="onSubjectChange(this.value)">
            </select>


            <!-- LANGUAGE -->

            <select
                id="language-select"
                onchange="onLanguageChange(this.value)">

                <option value="hi">
                    हिंदी
                </option>

                <option value="en">
                    English
                </option>

            </select>


            <!-- LOGOUT -->

            <button
                class="logout-btn"
                onclick="performLogout()"
                id="logout-text">

                Logout

            </button>

        </div>

    </div>


    <!-- =================================================
         MAIN FOLDERS
    ================================================== -->

    <div id="main-view">

        <div
            class="section-title"
            id="explore-title">

            श्रेणियाँ देखें

        </div>


        <div class="cards">


            <!-- OBJECTIVE -->

            <div
                class="folder-card"
                onclick="openFolder('objective')">

                <div class="folder-icon">
                    🎯
                </div>

                <h3 id="objective-title">
                    वस्तुनिष्ठ प्रश्न
                </h3>

                <p id="objective-desc">
                    अध्यायवार MCQ
                </p>

            </div>


            <!-- SUBJECTIVE -->

            <div
                class="folder-card"
                onclick="openFolder('subjective')">

                <div class="folder-icon">
                    📖
                </div>

                <h3 id="subjective-title">
                    विषयपरक प्रश्न
                </h3>

                <p id="subjective-desc">
                    विस्तृत प्रश्न एवं उत्तर
                </p>

            </div>


            <!-- NOTES -->

            <div
                class="folder-card"
                onclick="openFolder('notes')">

                <div class="folder-icon">
                    📝
                </div>

                <h3 id="notes-title">
                    नोट्स
                </h3>

                <p id="notes-desc">
                    अध्यायवार नोट्स
                </p>

            </div>

        </div>

    </div>


    <!-- =================================================
         CHAPTER VIEW
    ================================================== -->

    <div id="chapter-view">

        <div class="top-nav">

            <button
                class="back-btn"
                onclick="backToMain()"
                id="back-main-text">

                ← वापस जाएँ

            </button>

        </div>


        <h2
            class="view-title"
            id="chapter-view-title">

        </h2>


        <div
            class="subject-info"
            id="subject-info">

        </div>


        <div
            class="chapter-list"
            id="chapter-list">

        </div>

    </div>


    <!-- =================================================
         CONTENT VIEW
    ================================================== -->

    <div id="content-view">

        <div class="top-nav">

            <button
                class="back-btn"
                onclick="backToChapters()"
                id="back-chapter-text">

                ← अध्याय

            </button>

        </div>


        <h2
            class="view-title"
            id="content-title">

        </h2>


        <div id="content-container">

        </div>

    </div>

</div>


<!-- =====================================================
     YOUR DATA FILES
===================================================== -->

<script src="data.js"></script>
<script src="quiz-data.js"></script>


<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let activeClass = "6";
let activeSubject = "";
let activeLanguage = "hi";

let activeFolder = "";
let activeChapterIndex = 0;


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener("DOMContentLoaded", function(){

    const savedLogin =
        localStorage.getItem("isLoggedIn");

    if(savedLogin === "true"){

        showDashboard();

    }else{

        document.getElementById("login-screen").style.display =
            "flex";

        document.getElementById("dashboard-screen").style.display =
            "none";

    }

    populateSubjects();

    updateLanguageUI();

});


/* =====================================================
   LOGIN
===================================================== */

function performLogin(){

    localStorage.setItem(
        "isLoggedIn",
        "true"
    );

    showDashboard();

}


function showDashboard(){

    document.getElementById("login-screen").style.display =
        "none";

    document.getElementById("dashboard-screen").style.display =
        "block";

    populateSubjects();

    updateLanguageUI();

}


function performLogout(){

    localStorage.removeItem("isLoggedIn");

    document.getElementById("dashboard-screen").style.display =
        "none";

    document.getElementById("login-screen").style.display =
        "flex";

}


/* =====================================================
   GET CLASS DATA
===================================================== */

function getClassData(){

    if(
        typeof ncertData === "undefined"
    ){

        return {};

    }

    return ncertData[activeClass] || {};

}


/* =====================================================
   SUBJECT NAMES
===================================================== */

const subjectNames = {

    science:{
        hi:"विज्ञान",
        en:"Science"
    },

    math:{
        hi:"गणित",
        en:"Mathematics"
    },

    maths:{
        hi:"गणित",
        en:"Mathematics"
    },

    physics:{
        hi:"भौतिक विज्ञान",
        en:"Physics"
    },

    chemistry:{
        hi:"रसायन विज्ञान",
        en:"Chemistry"
    },

    bio:{
        hi:"जीव विज्ञान",
        en:"Biology"
    },

    biology:{
        hi:"जीव विज्ञान",
        en:"Biology"
    },

    history:{
        hi:"इतिहास",
        en:"History"
    },

    geography:{
        hi:"भूगोल",
        en:"Geography"
    },

    civics:{
        hi:"नागरिक शास्त्र",
        en:"Civics"
    },

    economics:{
        hi:"अर्थशास्त्र",
        en:"Economics"
    }

};


function getSubjectDisplayName(subject){

    if(subjectNames[subject]){

        return subjectNames[subject][activeLanguage];

    }

    return subject
        .replace(/[-_]/g," ")
        .replace(/\b\w/g,function(c){
            return c.toUpperCase();
        });

}


/* =====================================================
   POPULATE SUBJECTS
===================================================== */

function populateSubjects(){

    const select =
        document.getElementById("subject-select");

    if(!select){
        return;
    }

    const classData =
        getClassData();

    const subjects =
        Object.keys(classData);

    select.innerHTML = "";


    if(subjects.length === 0){

        activeSubject = "";

        const option =
            document.createElement("option");

        option.textContent =
            activeLanguage === "hi"
            ? "कोई विषय नहीं मिला"
            : "No subject found";

        select.appendChild(option);

        return;

    }


    subjects.forEach(function(subject){

        const option =
            document.createElement("option");

        option.value = subject;

        option.textContent =
            getSubjectDisplayName(subject);

        select.appendChild(option);

    });


    /*
       अगर पहले वाला subject मौजूद है
       तो वही रखें।
    */

    if(subjects.includes(activeSubject)){

        select.value = activeSubject;

    }else{

        activeSubject = subjects[0];

        select.value = activeSubject;

    }

}


/* =====================================================
   CLASS CHANGE
===================================================== */

function onClassChange(value){

    activeClass = String(value);

    activeFolder = "";

    populateSubjects();

    backToMain();

}


/* =====================================================
   SUBJECT CHANGE
===================================================== */

function onSubjectChange(value){

    activeSubject = value;

    activeFolder = "";

    backToMain();

}


/* =====================================================
   LANGUAGE CHANGE
===================================================== */

function onLanguageChange(value){

    activeLanguage = value;

    populateSubjects();

    updateLanguageUI();

    /*
       अगर chapter page खुला है
       तो उसे भी तुरंत update करें।
    */

    if(
        document.getElementById("chapter-view").style.display ===
        "block"
    ){

        showChapters();

    }


    if(
        document.getElementById("content-view").style.display ===
        "block"
    ){

        renderChapterContent();

    }

}


/* =====================================================
   UI LANGUAGE
===================================================== */

function updateLanguageUI(){

    const hi =
        activeLanguage === "hi";


    document.getElementById("dashboard-title").textContent =
        hi
        ? "टॉपर स्टडी हब"
        : "Topper Study Hub";


    document.getElementById("explore-title").textContent =
        hi
        ? "श्रेणियाँ देखें"
        : "Explore Categories";


    document.getElementById("objective-title").textContent =
        hi
        ? "वस्तुनिष्ठ प्रश्न"
        : "Objective Questions";


    document.getElementById("objective-desc").textContent =
        hi
        ? "अध्यायवार बहुविकल्पीय प्रश्न"
        : "Chapter-wise Multiple Choice Questions";


    document.getElementById("subjective-title").textContent =
        hi
        ? "विषयपरक प्रश्न"
        : "Subjective Questions";


    document.getElementById("subjective-desc").textContent =
        hi
        ? "विस्तृत प्रश्न एवं उत्तर"
        : "Detailed Questions & Answers";


    document.getElementById("notes-title").textContent =
        hi
        ? "नोट्स"
        : "Notes";


    document.getElementById("notes-desc").textContent =
        hi
        ? "अध्यायवार नोट्स"
        : "Chapter-wise Notes";


    document.getElementById("logout-text").textContent =
        hi
        ? "लॉग आउट"
        : "Logout";


    document.getElementById("back-main-text").textContent =
        hi
        ? "← वापस जाएँ"
        : "← Back";


    document.getElementById("back-chapter-text").textContent =
        hi
        ? "← अध्याय"
        : "← Chapters";


    document.getElementById("email-label").textContent =
        hi
        ? "ईमेल पता"
        : "Email Address";


    document.getElementById("password-label").textContent =
        hi
        ? "पासवर्ड"
        : "Password";


    document.getElementById("login-button").textContent =
        hi
        ? "पोर्टल खोलें"
        : "Access Portal";

}


/* =====================================================
   GET CHAPTERS
===================================================== */

function getChapters(){

    const classData =
        getClassData();

    if(
        !activeSubject ||
        !classData[activeSubject]
    ){

        return [];

    }

    /*
       data.js में chapters array है
    */

    return classData[activeSubject];

}


/* =====================================================
   PARSE CHAPTER
===================================================== */

function parseChapter(chapter){

    let text =
        String(chapter || "").trim();


    /*
       Chapter 1:
       Chapter 10:
       etc.
    */

    let numberMatch =
        text.match(
            /^Chapter\s*(\d+)\s*:/i
        );


    let number =
        numberMatch
        ? numberMatch[1]
        : "";


    let title =
        text.replace(
            /^Chapter\s*\d+\s*:\s*/i,
            ""
        );


    /*
       आखिरी parentheses को Hindi माना जाएगा।
    */

    let hindiMatch =
        title.match(
            /\(([^()]*)\)\s*$/
        );


    let english =
        title;

    let hindi =
        title;


    if(hindiMatch){

        hindi =
            hindiMatch[1].trim();

        english =
            title
            .replace(
                /\s*\([^()]*\)\s*$/,
                ""
            )
            .trim();

    }


    return {

        number:number,

        english:english,

        hindi:hindi

    };

}


/* =====================================================
   OPEN FOLDER
===================================================== */

function openFolder(folderType){

    activeFolder = folderType;

    document.getElementById("main-view").style.display =
        "none";

    document.getElementById("content-view").style.display =
        "none";

    document.getElementById("chapter-view").style.display =
        "block";

    showChapters();

}


/* =====================================================
   SHOW ALL CHAPTERS
===================================================== */

function showChapters(){

    const list =
        document.getElementById("chapter-list");

    list.innerHTML = "";


    const chapters =
        getChapters();


    const subjectName =
        getSubjectDisplayName(activeSubject);


    let folderName;


    if(activeFolder === "objective"){

        folderName =
            activeLanguage === "hi"
            ? "वस्तुनिष्ठ प्रश्न"
            : "Objective Questions";

    }

    else if(activeFolder === "subjective"){

        folderName =
            activeLanguage === "hi"
            ? "विषयपरक प्रश्न"
            : "Subjective Questions";

    }

    else{

        folderName =
            activeLanguage === "hi"
            ? "नोट्स"
            : "Notes";

    }


    document.getElementById(
        "chapter-view-title"
    ).textContent =
        folderName;


    document.getElementById(
        "subject-info"
    ).textContent =

        (
            activeLanguage === "hi"
            ? `कक्षा ${activeClass} • विषय: ${subjectName} • कुल अध्याय: ${chapters.length}`
            : `Class ${activeClass} • Subject: ${subjectName} • Total Chapters: ${chapters.length}`
        );


    if(chapters.length === 0){

        list.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस विषय के अध्याय उपलब्ध नहीं हैं।"
                    : "No chapters available for this subject."
                }
             </div>`;

        return;

    }


    /*
       सभी chapters loop होंगे।
       कोई chapter skip नहीं होगा।
    */

    chapters.forEach(function(chapter,index){

        const parsed =
            parseChapter(chapter);


        const card =
            document.createElement("div");

        card.className =
            "chapter-card";


        const number =
            document.createElement("div");

        number.className =
            "chapter-number";

        number.textContent =
            parsed.number || (index + 1);


        const name =
            document.createElement("div");

        name.className =
            "chapter-name";


        /*
           सबसे महत्वपूर्ण:
           Hindi में Hindi title
           English में English title
        */

        name.textContent =
            activeLanguage === "hi"
            ? parsed.hindi
            : parsed.english;


        card.appendChild(number);

        card.appendChild(name);


        card.onclick =
            function(){

                openChapter(index);

            };


        list.appendChild(card);

    });

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(index){

    activeChapterIndex =
        index;


    document.getElementById(
        "chapter-view"
    ).style.display = "none";


    document.getElementById(
        "content-view"
    ).style.display = "block";


    renderChapterContent();

}


/* =====================================================
   CONTENT
===================================================== */

function renderChapterContent(){

    const chapters =
        getChapters();


    if(!chapters[activeChapterIndex]){

        return;

    }


    const parsed =
        parseChapter(
            chapters[activeChapterIndex]
        );


    const title =
        activeLanguage === "hi"
        ? parsed.hindi
        : parsed.english;


    document.getElementById(
        "content-title"
    ).textContent =

        `Chapter ${parsed.number}: ${title}`;


    const container =
        document.getElementById(
            "content-container"
        );


    container.innerHTML = "";


    /*
       अभी objective के लिए quiz-data.js
       से data खोजेंगे।
    */

    if(activeFolder === "objective"){

        renderObjective(
            container
        );

    }

    else if(activeFolder === "subjective"){

        renderSubjective(
            container
        );

    }

    else{

        renderNotes(
            container
        );

    }

}


/* =====================================================
   FIND QUIZ DATA
===================================================== */

function getQuizForChapter(){

    /*
       अगर quiz-data.js में quizData है
    */

    if(
        typeof quizData !== "undefined"
    ){

        /*
           Format:
           quizData[6].science[0]
        */

        if(
            quizData[activeClass] &&
            quizData[activeClass][activeSubject] &&
            quizData[activeClass][activeSubject][activeChapterIndex]
        ){

            return
                quizData[activeClass]
                [activeSubject]
                [activeChapterIndex];

        }

    }


    /*
       अगर chapter1Quiz जैसा पुराना format है
    */

    if(
        typeof chapter1Quiz !== "undefined" &&
        activeClass === "11" &&
        (
            activeSubject === "bio" ||
            activeSubject === "biology"
        ) &&
        activeChapterIndex === 0
    ){

        return chapter1Quiz;

    }


    return null;

}


/* =====================================================
   OBJECTIVE
===================================================== */

function renderObjective(container){

    const data =
        getQuizForChapter();


    if(!data){

        container.innerHTML =
            `<div class="content-box">

                <h3>
                    ${
                        activeLanguage === "hi"
                        ? "Objective Questions"
                        : "Objective Questions"
                    }
                </h3>

                <div class="content-text">

                    ${
                        activeLanguage === "hi"
                        ? "इस अध्याय के MCQ अभी quiz-data.js में उपलब्ध नहीं हैं।"
                        : "MCQs for this chapter are not available in quiz-data.js yet."
                    }

                </div>

            </div>`;

        return;

    }


    /*
       data सीधे array हो सकता है
       या data.objective array
    */

    let questions;


    if(Array.isArray(data)){

        questions = data;

    }

    else if(Array.isArray(data.objective)){

        questions = data.objective;

    }

    else if(Array.isArray(data.mcqs)){

        questions = data.mcqs;

    }

    else{

        questions = [];

    }


    if(questions.length === 0){

        container.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस अध्याय के objective questions नहीं मिले।"
                    : "No objective questions found."
                }
             </div>`;

        return;

    }


    questions.forEach(
        function(item,index){

            createMCQ(
                item,
                index,
                container
            );

        }
    );

}


/* =====================================================
   CREATE MCQ
===================================================== */

function createMCQ(
    item,
    index,
    container
){

    const card =
        document.createElement("div");

    card.className =
        "mcq-card";


    const question =
        document.createElement("div");

    question.className =
        "mcq-question";


    question.textContent =
        `${index + 1}. ${getQuestion(item)}`;


    card.appendChild(question);


    let options =
        item.options ||
        item.option ||
        [];


    options.forEach(
        function(option,optIndex){

            const button =
                document.createElement("button");

            button.className =
                "mcq-option";


            button.textContent =
                `${String.fromCharCode(65 + optIndex)}. ${getOption(option)}`;


            button.onclick =
                function(){

                    checkMCQ(
                        card,
                        button,
                        optIndex,
                        item.correct
                    );

                };


            card.appendChild(button);

        }
    );


    const result =
        document.createElement("div");

    result.className =
        "result-message";


    card.appendChild(result);


    container.appendChild(card);

}


/* =====================================================
   CHECK MCQ
===================================================== */

function checkMCQ(
    card,
    selectedButton,
    selectedIndex,
    correctIndex
){

    const buttons =
        card.querySelectorAll(
            ".mcq-option"
        );


    /*
       एक बार answer देने के बाद
       दोबारा click नहीं होगा।
    */

    buttons.forEach(
        function(button){

            button.disabled = true;

        }
    );


    const result =
        card.querySelector(
            ".result-message"
        );


    if(
        Number(selectedIndex) ===
        Number(correctIndex)
    ){

        selectedButton.classList.add(
            "correct"
        );


        result.textContent =
            activeLanguage === "hi"
            ? "✓ सही उत्तर"
            : "✓ Correct Answer";


        result.style.color =
            "#4ade80";

    }

    else{

        selectedButton.classList.add(
            "wrong"
        );


        if(buttons[correctIndex]){

            buttons[correctIndex]
                .classList.add("correct");

        }


        result.textContent =
            activeLanguage === "hi"
            ? "✗ गलत उत्तर"
            : "✗ Wrong Answer";


        result.style.color =
            "#f87171";

    }

}


/* =====================================================
   QUESTION LANGUAGE
===================================================== */

function getQuestion(item){

    if(!item){

        return "";

    }


    if(activeLanguage === "hi"){

        return (
            item.hi ||
            item.questionHi ||
            item.question_hindi ||
            item.q_hi ||
            item.qHindi ||
            item.q ||
            item.question ||
            ""
        );

    }


    return (
        item.en ||
        item.questionEn ||
        item.question_english ||
        item.q_en ||
        item.qEnglish ||
        item.q ||
        item.question ||
        ""
    );

}


/* =====================================================
   OPTION LANGUAGE
===================================================== */

function getOption(option){

    if(typeof option === "string"){

        return option;

    }


    if(activeLanguage === "hi"){

        return (
            option.hi ||
            option.hindi ||
            option.textHi ||
            option.text ||
            ""
        );

    }


    return (
        option.en ||
        option.english ||
        option.textEn ||
        option.text ||
        ""
    );

}


/* =====================================================
   SUBJECTIVE
===================================================== */

function renderSubjective(container){

    const data =
        getQuizForChapter();


    let questions = [];


    if(data){

        if(Array.isArray(data.subjective)){

            questions =
                data.subjective;

        }

        else if(Array.isArray(data.questions)){

            questions =
                data.questions;

        }

    }


    if(questions.length === 0){

        container.innerHTML =
            `<div class="content-box">

                <h3>
                    ${
                        activeLanguage === "hi"
                        ? "विषयपरक प्रश्न"
                        : "Subjective Questions"
                    }
                </h3>

                <div class="content-text">

                    ${
                        activeLanguage === "hi"
                        ? "इस अध्याय के subjective questions अभी उपलब्ध नहीं हैं।"
                        : "Subjective questions are not available yet."
                    }

                </div>

            </div>`;

        return;

    }


    questions.forEach(
        function(item,index){

            const box =
                document.createElement("div");

            box.className =
                "content-box";


            const question =
                getQuestion(item);


            const answer =
                activeLanguage === "hi"
                ? (
                    item.answerHi ||
                    item.answer_hindi ||
                    item.answer ||
                    ""
                  )
                : (
                    item.answerEn ||
                    item.answer_english ||
                    item.answer ||
                    ""
                  );


            box.innerHTML =
                `
                <h3>
                    ${index + 1}. ${escapeHTML(question)}
                </h3>

                <div class="content-text">
                    ${escapeHTML(answer).replace(/\n/g,"<br>")}
                </div>
                `;


            container.appendChild(box);

        }
    );

}


/* =====================================================
   NOTES
===================================================== */

function renderNotes(container){

    const data =
        getQuizForChapter();


    let notes = "";


    if(data){

        if(activeLanguage === "hi"){

            notes =
                data.notesHi ||
                data.noteHi ||
                data.notes_hindi ||
                data.note_hindi ||
                data.notes ||
                data.note ||
                "";

        }

        else{

            notes =
                data.notesEn ||
                data.noteEn ||
                data.notes_english ||
                data.note_english ||
                data.notes ||
                data.note ||
                "";

        }

    }


    if(!notes){

        container.innerHTML =
            `<div class="content-box">

                <h3>
                    ${
                        activeLanguage === "hi"
                        ? "अध्याय नोट्स"
                        : "Chapter Notes"
                    }
                </h3>

                <div class="content-text">

                    ${
                        activeLanguage === "hi"
                        ? "इस अध्याय के notes अभी उपलब्ध नहीं हैं।"
                        : "Notes for this chapter are not available yet."
                    }

                </div>

            </div>`;

        return;

    }


    const box =
        document.createElement("div");

    box.className =
        "content-box";


    box.innerHTML =
        `<div class="content-text">
            ${escapeHTML(notes).replace(/\n/g,"<br>")}
         </div>`;


    container.appendChild(box);

}


/* =====================================================
   NAVIGATION
===================================================== */

function backToMain(){

    document.getElementById(
        "content-view"
    ).style.display = "none";


    document.getElementById(
        "chapter-view"
    ).style.display = "none";


    document.getElementById(
        "main-view"
    ).style.display = "block";

}


function backToChapters(){

    document.getElementById(
        "content-view"
    ).style.display = "none";


    document.getElementById(
        "chapter-view"
    ).style.display = "block";


    showChapters();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value == null
        ? ""
        : String(value);

    return div.innerHTML;

}
