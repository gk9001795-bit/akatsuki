<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Topper Study Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:linear-gradient(135deg,#090d16,#111827);
    color:white;
    min-height:100vh;
}

/* LOGIN */

#login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:430px;
    padding:35px;
    background:rgba(30,41,59,.95);
    border:1px solid rgba(56,189,248,.2);
    border-radius:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.login-card h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:#cbd5e1;
}

.form-group input{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
    outline:none;
}

.submit-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#3b82f6,#6366f1);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

/* DASHBOARD */

#dashboard-screen{
    display:none;
    max-width:1250px;
    margin:auto;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    border-bottom:1px solid #334155;
    padding-bottom:20px;
    margin-bottom:25px;
}

.header h2{
    color:#38bdf8;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

select{
    background:#1e293b;
    color:white;
    border:1px solid #475569;
    border-radius:8px;
    padding:10px 13px;
    cursor:pointer;
}

.logout{
    background:#ef4444;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:bold;
}

/* FOLDERS */

.section-title{
    font-size:20px;
    margin-bottom:18px;
    color:#f8fafc;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    background:rgba(30,41,59,.8);
    border:1px solid #334155;
    border-radius:16px;
    padding:25px;
    cursor:pointer;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#38bdf8;
}

.icon{
    font-size:35px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#94a3b8;
    font-size:14px;
}

/* CHAPTER VIEW */

#chapter-view{
    display:none;
}

.back-btn{
    background:#334155;
    color:white;
    border:0;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:20px;
}

.chapter-title{
    color:#38bdf8;
    margin-bottom:20px;
}

.chapter-list{
    display:grid;
    gap:12px;
}

.chapter-item{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:12px;
    padding:16px;
    cursor:pointer;
    transition:.25s;
}

.chapter-item:hover{
    border-color:#38bdf8;
    background:#243449;
}

.chapter-number{
    color:#38bdf8;
    font-weight:bold;
    margin-right:8px;
}

/* CONTENT */

#content-view{
    display:none;
}

.content-box{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
}

.question{
    font-weight:bold;
    margin-bottom:15px;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:12px;
    margin:8px 0;
    border-radius:8px;
    border:1px solid #475569;
    background:#1e293b;
    color:white;
    cursor:pointer;
}

.option.correct{
    background:#166534;
    border-color:#22c55e;
}

.option.wrong{
    background:#991b1b;
    border-color:#ef4444;
}

.answer{
    display:none;
    margin-top:12px;
    padding:10px;
    border-radius:8px;
    background:#172554;
    color:#bfdbfe;
}

@media(max-width:600px){
    #dashboard-screen{
        padding:15px;
    }

    .login-card{
        padding:25px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login-screen">

    <div class="login-card">

        <h1>Topper Study Hub</h1>

        <div class="subtitle">
            Bihar Board & NCERT Study Portal
        </div>

        <div class="form-group">
            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="student@gmail.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password">
        </div>

        <button class="submit-btn" onclick="performLogin()">
            Access Portal
        </button>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard-screen">

    <div class="header">

        <h2 id="dashboard-title">
            Topper Study Hub
        </h2>

        <div class="controls">

            <select id="class-select"
                    onchange="changeClass(this.value)">

                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>

            </select>


            <select id="subject-select"
                    onchange="changeSubject(this.value)">
            </select>


            <select id="language-select"
                    onchange="changeLanguage(this.value)">

                <option value="hi">
                    हिंदी
                </option>

                <option value="en">
                    English
                </option>

            </select>


            <button class="logout"
                    onclick="performLogout()">

                Logout

            </button>

        </div>

    </div>


    <!-- FOLDERS -->

    <div id="folders-view">

        <div class="section-title"
             id="explore-title">

            श्रेणियाँ देखें

        </div>


        <div class="cards">

            <div class="card"
                 onclick="openFolder('objective')">

                <div class="icon">🎯</div>

                <h3 id="objective-title">
                    वस्तुनिष्ठ प्रश्न
                </h3>

                <p id="objective-desc">
                    Chapter-wise MCQ
                </p>

            </div>


            <div class="card"
                 onclick="openFolder('subjective')">

                <div class="icon">📖</div>

                <h3 id="subjective-title">
                    विषयपरक प्रश्न
                </h3>

                <p id="subjective-desc">
                    Detailed Questions & Answers
                </p>

            </div>


            <div class="card"
                 onclick="openFolder('notes')">

                <div class="icon">📝</div>

                <h3 id="notes-title">
                    नोट्स
                </h3>

                <p id="notes-desc">
                    Chapter-wise Notes
                </p>

            </div>

        </div>

    </div>


    <!-- CHAPTER LIST -->

    <div id="chapter-view">

        <button class="back-btn"
                onclick="backToFolders()">

            ← Back

        </button>

        <h2 class="chapter-title"
            id="chapter-heading">

        </h2>

        <div class="chapter-list"
             id="chapter-list">

        </div>

    </div>


    <!-- CONTENT -->

    <div id="content-view">

        <button class="back-btn"
                onclick="backToChapters()">

            ← Chapters

        </button>

        <h2 class="chapter-title"
            id="content-heading">

        </h2>

        <div id="content-container">

        </div>

    </div>

</div>


<!-- IMPORTANT:
     पहले data.js और फिर quiz-data.js -->
<script src="data.js"></script>
<script src="quiz-data.js"></script>


<script>

/* =====================================================
   GLOBAL STATE
===================================================== */

let activeClass = "6";
let activeSubject = "";
let activeLanguage = "hi";
let activeFolder = "";
let activeChapterIndex = 0;


/* =====================================================
   LOGIN
===================================================== */

window.addEventListener("DOMContentLoaded", function(){

    if(localStorage.getItem("isLoggedIn") === "true"){
        showDashboard();
    }

    populateSubjects();

});


function performLogin(){

    localStorage.setItem("isLoggedIn","true");

    showDashboard();

}


function showDashboard(){

    document.getElementById("login-screen").style.display = "none";

    document.getElementById("dashboard-screen").style.display = "block";

    populateSubjects();

    updateLanguageUI();

}


function performLogout(){

    localStorage.removeItem("isLoggedIn");

    document.getElementById("dashboard-screen").style.display = "none";

    document.getElementById("login-screen").style.display = "flex";

}


/* =====================================================
   SUBJECTS
===================================================== */

function populateSubjects(){

    const subjectSelect =
        document.getElementById("subject-select");

    subjectSelect.innerHTML = "";

    const classData =
        window.ncertData &&
        window.ncertData[activeClass]
        ? window.ncertData[activeClass]
        : {};

    const subjects =
        Object.keys(classData);

    if(subjects.length === 0){

        activeSubject = "";

        return;

    }

    subjects.forEach(function(subject){

        const option =
            document.createElement("option");

        option.value = subject;

        option.textContent =
            getSubjectName(subject);

        subjectSelect.appendChild(option);

    });

    activeSubject = subjects[0];

}


/* =====================================================
   SUBJECT NAME
===================================================== */

function getSubjectName(subject){

    const names = {

        science:{
            hi:"विज्ञान",
            en:"Science"
        },

        math:{
            hi:"गणित",
            en:"Mathematics"
        },

        maths:{
            hi:"गणित",
            en:"Mathematics"
        },

        physics:{
            hi:"भौतिक विज्ञान",
            en:"Physics"
        },

        chemistry:{
            hi:"रसायन विज्ञान",
            en:"Chemistry"
        },

        biology:{
            hi:"जीव विज्ञान",
            en:"Biology"
        },

        bio:{
            hi:"जीव विज्ञान",
            en:"Biology"
        },

        history:{
            hi:"इतिहास",
            en:"History"
        },

        geography:{
            hi:"भूगोल",
            en:"Geography"
        },

        civics:{
            hi:"नागरिक शास्त्र",
            en:"Civics"
        },

        economics:{
            hi:"अर्थशास्त्र",
            en:"Economics"
        }

    };

    if(names[subject]){
        return names[subject][activeLanguage];
    }

    return subject.toUpperCase();

}


/* =====================================================
   CLASS CHANGE
===================================================== */

function changeClass(value){

    activeClass = String(value);

    populateSubjects();

}


/* =====================================================
   SUBJECT CHANGE
===================================================== */

function changeSubject(value){

    activeSubject = value;

}


/* =====================================================
   LANGUAGE CHANGE
===================================================== */

function changeLanguage(value){

    activeLanguage = value;

    populateSubjects();

    updateLanguageUI();

}


/* =====================================================
   LANGUAGE UI
===================================================== */

function updateLanguageUI(){

    if(activeLanguage === "hi"){

        document.getElementById("dashboard-title").textContent =
            "टॉपर स्टडी हब";

        document.getElementById("explore-title").textContent =
            "श्रेणियाँ देखें";

        document.getElementById("objective-title").textContent =
            "वस्तुनिष्ठ प्रश्न";

        document.getElementById("objective-desc").textContent =
            "अध्यायवार बहुविकल्पीय प्रश्न";

        document.getElementById("subjective-title").textContent =
            "विषयपरक प्रश्न";

        document.getElementById("subjective-desc").textContent =
            "विस्तृत प्रश्न एवं उत्तर";

        document.getElementById("notes-title").textContent =
            "नोट्स";

        document.getElementById("notes-desc").textContent =
            "अध्यायवार नोट्स";

    }

    else{

        document.getElementById("dashboard-title").textContent =
            "Topper Study Hub";

        document.getElementById("explore-title").textContent =
            "Explore Categories";

        document.getElementById("objective-title").textContent =
            "Objective Questions";

        document.getElementById("objective-desc").textContent =
            "Chapter-wise Multiple Choice Questions";

        document.getElementById("subjective-title").textContent =
            "Subjective Questions";

        document.getElementById("subjective-desc").textContent =
            "Detailed Questions & Answers";

        document.getElementById("notes-title").textContent =
            "Notes";

        document.getElementById("notes-desc").textContent =
            "Chapter-wise Notes";

    }

}


/* =====================================================
   GET CHAPTER DATA
===================================================== */

function getChapters(){

    if(
        !window.ncertData ||
        !window.ncertData[activeClass] ||
        !window.ncertData[activeClass][activeSubject]
    ){

        return [];

    }

    return window.ncertData[activeClass][activeSubject];

}


/* =====================================================
   PARSE CHAPTER NAME
===================================================== */

/*
   data.js में:

   "Chapter 1: Matter (पदार्थ)"

   होगा।

   English mode:
   Matter

   Hindi mode:
   पदार्थ
*/

function parseChapter(chapter){

    let text = String(chapter);

    let numberMatch =
        text.match(/^Chapter\s*(\d+)\s*:/i);

    let number =
        numberMatch
        ? numberMatch[1]
        : "";

    let title =
        text.replace(/^Chapter\s*\d+\s*:\s*/i,"");

    let hindiMatch =
        title.match(/\(([^()]*)\)\s*$/);

    let englishTitle = title;
    let hindiTitle = title;

    if(hindiMatch){

        hindiTitle =
            hindiMatch[1].trim();

        englishTitle =
            title
            .replace(/\s*\([^()]*\)\s*$/,"")
            .trim();

    }

    return {

        number:number,

        english:englishTitle,

        hindi:hindiTitle

    };

}


/* =====================================================
   OPEN FOLDER
===================================================== */

function openFolder(folder){

    activeFolder = folder;

    document.getElementById("folders-view").style.display =
        "none";

    document.getElementById("content-view").style.display =
        "none";

    document.getElementById("chapter-view").style.display =
        "block";

    showChapters();

}


/* =====================================================
   SHOW ALL CHAPTERS
===================================================== */

function showChapters(){

    const chapters = getChapters();

    const list =
        document.getElementById("chapter-list");

    list.innerHTML = "";


    document.getElementById("chapter-heading").textContent =
        getSubjectName(activeSubject) +
        " - " +
        (
            activeLanguage === "hi"
            ? "अध्याय चुनें"
            : "Select Chapter"
        );


    if(chapters.length === 0){

        list.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस विषय का अध्याय उपलब्ध नहीं है।"
                    : "Chapters are not available for this subject."
                }
             </div>`;

        return;

    }


    chapters.forEach(function(chapter,index){

        const parsed =
            parseChapter(chapter);


        const item =
            document.createElement("div");

        item.className = "chapter-item";


        const title =
            activeLanguage === "hi"
            ? parsed.hindi
            : parsed.english;


        item.innerHTML =

            `<span class="chapter-number">
                Chapter ${parsed.number}
             </span>
             ${escapeHTML(title)}`;


        item.onclick = function(){

            openChapter(index);

        };


        list.appendChild(item);

    });

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(index){

    activeChapterIndex = index;

    document.getElementById("chapter-view").style.display =
        "none";

    document.getElementById("content-view").style.display =
        "block";

    renderChapterContent();

}


/* =====================================================
   RENDER CONTENT
===================================================== */

function renderChapterContent(){

    const chapters = getChapters();

    if(!chapters[activeChapterIndex]){
        return;
    }

    const parsed =
        parseChapter(chapters[activeChapterIndex]);


    const title =
        activeLanguage === "hi"
        ? parsed.hindi
        : parsed.english;


    document.getElementById("content-heading").textContent =
        `Chapter ${parsed.number}: ${title}`;


    const container =
        document.getElementById("content-container");

    container.innerHTML = "";


    /*
       quiz-data.js से chapter content खोजने की कोशिश
    */

    const quiz =
        findQuizData(
            activeClass,
            activeSubject,
            activeChapterIndex
        );


    if(activeFolder === "objective"){

        renderObjective(
            quiz,
            container
        );

    }

    else if(activeFolder === "subjective"){

        renderSubjective(
            quiz,
            container
        );

    }

    else{

        renderNotes(
            quiz,
            container
        );

    }

}


/* =====================================================
   QUIZ DATA FINDER
===================================================== */

function findQuizData(classNo,subject,index){

    /*
      यह कई common formats को support करेगा।

      बाद में quiz-data.js में
      तुम्हारा actual data रखा जा सकता है।
    */

    if(typeof quizData !== "undefined"){

        if(
            quizData[classNo] &&
            quizData[classNo][subject] &&
            quizData[classNo][subject][index]
        ){

            return quizData[classNo][subject][index];

        }

    }


    if(typeof objectiveData !== "undefined"){

        if(
            objectiveData[classNo] &&
            objectiveData[classNo][subject] &&
            objectiveData[classNo][subject][index]
        ){

            return objectiveData[classNo][subject][index];

        }

    }


    return null;

}


/* =====================================================
   OBJECTIVE
===================================================== */

function renderObjective(data,container){

    if(!Array.isArray(data)){

        container.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस अध्याय के MCQ अभी quiz-data.js में नहीं जोड़े गए हैं।"
                    : "MCQs for this chapter have not been added to quiz-data.js yet."
                }
             </div>`;

        return;

    }


    data.forEach(function(item,index){

        const box =
            document.createElement("div");

        box.className = "content-box";


        const question =
            document.createElement("div");

        question.className = "question";

        question.textContent =
            `${index + 1}. ${getQuestionText(item)}`;


        box.appendChild(question);


        if(Array.isArray(item.options)){

            item.options.forEach(function(option,optIndex){

                const button =
                    document.createElement("button");

                button.className = "option";

                button.textContent =
                    `${String.fromCharCode(65 + optIndex)}. ${getOptionText(option)}`;


                button.onclick = function(){

                    checkAnswer(
                        button,
                        optIndex,
                        item.correct
                    );

                };


                box.appendChild(button);

            });

        }


        container.appendChild(box);

    });

}


/* =====================================================
   ANSWER CHECK
===================================================== */

function checkAnswer(button,selected,correct){

    const parent =
        button.parentElement;

    const buttons =
        parent.querySelectorAll(".option");


    buttons.forEach(function(btn){

        btn.disabled = true;

    });


    if(Number(selected) === Number(correct)){

        button.classList.add("correct");

    }

    else{

        button.classList.add("wrong");

        if(buttons[correct]){
            buttons[correct].classList.add("correct");
        }

    }

}


/* =====================================================
   SUBJECTIVE
===================================================== */

function renderSubjective(data,container){

    if(!data){

        container.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस अध्याय के subjective questions अभी उपलब्ध नहीं हैं।"
                    : "Subjective questions are not available yet."
                }
             </div>`;

        return;

    }


    const questions =
        data.subjective ||
        data.questions ||
        [];


    if(!Array.isArray(questions)){

        container.innerHTML =
            `<div class="content-box">
                No subjective questions found.
             </div>`;

        return;

    }


    questions.forEach(function(item,index){

        const box =
            document.createElement("div");

        box.className = "content-box";


        box.innerHTML =
            `<div class="question">
                ${index + 1}. ${escapeHTML(
                    getQuestionText(item)
                )}
             </div>

             <div class="answer"
                  style="display:block">

                ${escapeHTML(
                    item.answer || ""
                )}

             </div>`;


        container.appendChild(box);

    });

}


/* =====================================================
   NOTES
===================================================== */

function renderNotes(data,container){

    if(!data){

        container.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस अध्याय के notes अभी उपलब्ध नहीं हैं।"
                    : "Notes are not available yet."
                }
             </div>`;

        return;

    }


    const notes =
        data.notes ||
        data.note ||
        "";


    if(!notes){

        container.innerHTML =
            `<div class="content-box">
                ${
                    activeLanguage === "hi"
                    ? "इस अध्याय के notes अभी उपलब्ध नहीं हैं।"
                    : "Notes are not available yet."
                }
             </div>`;

        return;

    }


    const box =
        document.createElement("div");

    box.className = "content-box";


    box.innerHTML =
        escapeHTML(notes)
        .replace(/\n/g,"<br>");


    container.appendChild(box);

}


/* =====================================================
   QUESTION LANGUAGE
===================================================== */

function getQuestionText(item){

    if(!item){
        return "";
    }

    if(
        activeLanguage === "hi" &&
        item.hi
    ){
        return item.hi;
    }

    if(
        activeLanguage === "hi" &&
        item.questionHi
    ){
        return item.questionHi;
    }

    if(
        activeLanguage === "en" &&
        item.en
    ){
        return item.en;
    }

    if(
        activeLanguage === "en" &&
        item.questionEn
    ){
        return item.questionEn;
    }

    return item.q ||
           item.question ||
           "";

}


function getOptionText(option){

    if(typeof option === "string"){
        return option;
    }

    if(
        activeLanguage === "hi" &&
        option.hi
    ){
        return option.hi;
    }

    if(
        activeLanguage === "en" &&
        option.en
    ){
        return option.en;
    }

    return option.text || "";

}


/* =====================================================
   NAVIGATION
===================================================== */

function backToFolders(){

    document.getElementById("chapter-view").style.display =
        "none";

    document.getElementById("content-view").style.display =
        "none";

    document.getElementById("folders-view").style.display =
        "block";

}


function backToChapters(){

    document.getElementById("content-view").style.display =
        "none";

    document.getElementById("chapter-view").style.display =
        "block";

}


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value == null ? "" : String(value);

    return div.innerHTML;

}
