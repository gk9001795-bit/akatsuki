<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Topper Study Hub - Bihar Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:linear-gradient(135deg,#070b14,#111827);
    color:#fff;
    min-height:100vh;
}

/* ================= LOGIN ================= */

#login-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-card{
    width:100%;
    max-width:440px;
    padding:40px;
    border-radius:24px;
    background:rgba(30,41,59,.94);
    border:1px solid rgba(56,189,248,.25);
    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.login-card h1{
    text-align:center;
    font-size:30px;
    margin-bottom:8px;
    background:linear-gradient(135deg,#38bdf8,#818cf8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.login-subtitle{
    text-align:center;
    color:#94a3b8;
    font-size:14px;
    margin-bottom:28px;
}

.google-btn,
.login-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:.2s;
}

.google-btn{
    background:white;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.google-btn img{
    width:20px;
    height:20px;
}

.google-btn:hover,
.login-btn:hover{
    transform:translateY(-2px);
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    color:#64748b;
    margin:22px 0;
    font-size:13px;
}

.divider:before,
.divider:after{
    content:"";
    height:1px;
    background:#334155;
    flex:1;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-size:13px;
}

.form-group input{
    width:100%;
    padding:13px 15px;
    border-radius:10px;
    border:1px solid #334155;
    outline:none;
    background:#0f172a;
    color:white;
    font-size:15px;
}

.form-group input:focus{
    border-color:#38bdf8;
    box-shadow:0 0 0 3px rgba(56,189,248,.12);
}

.login-btn{
    margin-top:5px;
    color:white;
    background:linear-gradient(135deg,#2563eb,#6366f1);
}

.login-message{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:8px;
    background:rgba(239,68,68,.15);
    color:#fca5a5;
    text-align:center;
    font-size:13px;
}

/* ================= DASHBOARD ================= */

#dashboard-screen{
    display:none;
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:25px 20px 50px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    padding-bottom:20px;
    margin-bottom:30px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.header h2{
    color:#38bdf8;
    font-size:24px;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

select{
    background:#1e293b;
    color:white;
    border:1px solid #475569;
    padding:10px 13px;
    border-radius:8px;
    outline:none;
}

.logout{
    background:#ef4444;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:600;
}

.logout:hover{
    background:#dc2626;
}

/* ================= CARDS ================= */

.section-title{
    font-size:19px;
    margin-bottom:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

.card{
    padding:25px;
    border-radius:17px;
    background:rgba(30,41,59,.75);
    border:1px solid rgba(255,255,255,.08);
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#38bdf8;
    box-shadow:0 12px 30px rgba(56,189,248,.12);
}

.icon{
    width:55px;
    height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:13px;
    background:rgba(56,189,248,.1);
    font-size:30px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#94a3b8;
    font-size:13px;
}

/* ================= CONTENT ================= */

#content-view{
    display:none;
}

.back-btn{
    background:#334155;
    color:white;
    border:0;
    padding:10px 17px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:20px;
}

.back-btn:hover{
    background:#475569;
}

.content-title{
    color:#38bdf8;
    margin-bottom:20px;
}

/* ================= QUIZ ================= */

.quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.score-box{
    background:#0f172a;
    border:1px solid #334155;
    padding:10px 15px;
    border-radius:9px;
    color:#38bdf8;
    font-weight:bold;
}

.quiz-card{
    background:rgba(15,23,42,.9);
    border:1px solid #334155;
    border-radius:13px;
    padding:20px;
    margin-bottom:17px;
}

.question{
    font-weight:600;
    line-height:1.6;
    margin-bottom:15px;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.option{
    padding:12px;
    text-align:left;
    border-radius:9px;
    border:1px solid #475569;
    background:#1e293b;
    color:#cbd5e1;
    cursor:pointer;
    transition:.2s;
}

.option:hover:not(:disabled){
    border-color:#38bdf8;
    background:#263548;
}

.option.correct{
    background:#166534 !important;
    border-color:#22c55e !important;
    color:white;
}

.option.wrong{
    background:#991b1b !important;
    border-color:#ef4444 !important;
    color:white;
}

.option:disabled{
    cursor:default;
}

.quiz-actions{
    display:flex;
    justify-content:center;
    margin-top:25px;
}

.reset-btn{
    border:0;
    background:linear-gradient(135deg,#2563eb,#6366f1);
    color:white;
    padding:12px 22px;
    border-radius:9px;
    cursor:pointer;
    font-weight:600;
}

.empty{
    text-align:center;
    padding:40px;
    color:#94a3b8;
    background:#0f172a;
    border-radius:12px;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    .login-card{
        padding:28px 20px;
    }

    .header h2{
        font-size:20px;
    }

    .controls{
        width:100%;
    }

    select,
    .logout{
        flex:1;
        min-width:100px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .quiz-card{
        padding:15px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN SCREEN
===================================================== -->

<div id="login-screen">

    <div class="login-card">

        <h1>Topper Study Hub</h1>

        <div class="login-subtitle">
            Bihar & Bihar Board Study Portal
        </div>

        <button class="google-btn" type="button" onclick="demoLogin()">
            <img
                src="https://developers.google.com/identity/images/g-logo.png"
                alt="Google"
            >
            <span>Continue with Google</span>
        </button>

        <div class="divider">
            OR LOGIN WITH EMAIL
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="student@gmail.com"
                autocomplete="username"
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
            >
        </div>

        <button
            class="login-btn"
            type="button"
            onclick="performLogin()"
        >
            Access Portal
        </button>

        <div id="login-message" class="login-message"></div>

    </div>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard-screen">

    <div class="header">

        <h2 id="dashboard-title">
            Topper Study Hub - NCERT Portal
        </h2>

        <div class="controls">

            <select id="class-select" onchange="changeClass()">
                <option value="6">Class 6</option>
                <option value="7">Class 7</option>
                <option value="8">Class 8</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11" selected>Class 11</option>
                <option value="12">Class 12</option>
            </select>

            <select id="subject-select" onchange="changeSubject()">
                <option value="biology">Biology</option>
            </select>

            <select id="language-select" onchange="changeLanguage()">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
            </select>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <!-- FOLDERS -->

    <div id="folders-view">

        <div class="section-title" id="explore-title">
            श्रेणियाँ देखें
        </div>

        <div class="cards">

            <div class="card" onclick="openFolder('notes')">

                <div class="icon">📝</div>

                <h3 id="notes-title">
                    Revision Notes
                </h3>

                <p id="notes-desc">
                    Chapter-wise summary & formulas
                </p>

            </div>


            <div class="card" onclick="openFolder('objective')">

                <div class="icon">🎯</div>

                <h3 id="objective-title">
                    Objective Questions
                </h3>

                <p id="objective-desc">
                    100 MCQs with instant answers
                </p>

            </div>


            <div class="card" onclick="openFolder('subjective')">

                <div class="icon">📖</div>

                <h3 id="subjective-title">
                    Subjective Solutions
                </h3>

                <p id="subjective-desc">
                    Detailed descriptive answers
                </p>

            </div>

        </div>

    </div>


    <!-- CONTENT -->

    <div id="content-view">

        <button class="back-btn" onclick="goBack()">
            ← Back
        </button>

        <h2 class="content-title" id="content-title">
            Content
        </h2>

        <div id="content-container"></div>

    </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let activeClass = "11";
let activeSubject = "biology";
let activeLanguage = "hi";

let score = 0;
let answered = 0;


/* =====================================================
   LOGIN
===================================================== */

document.addEventListener("DOMContentLoaded", function(){

    const loggedIn = localStorage.getItem("topperStudyLoggedIn");

    if(loggedIn === "true"){
        showDashboard();
    }else{
        showLogin();
    }

    updateLanguage();
});


function showLogin(){

    document.getElementById("login-screen").style.display = "flex";

    document.getElementById("dashboard-screen").style.display = "none";
}


function showDashboard(){

    document.getElementById("login-screen").style.display = "none";

    document.getElementById("dashboard-screen").style.display = "block";

    updateSubjects();

    updateLanguage();
}


function performLogin(){

    const email = document.getElementById("email").value.trim();

    const password = document.getElementById("password").value;

    const message = document.getElementById("login-message");


    /*
       Demo login:
       किसी भी non-empty email/password से portal खुलेगा।
    */

    if(!email || !password){

        message.style.display = "block";

        message.textContent =
            "कृपया Email और Password दोनों भरें।";

        return;
    }


    localStorage.setItem(
        "topperStudyLoggedIn",
        "true"
    );

    localStorage.setItem(
        "studentEmail",
        email
    );

    message.style.display = "none";

    showDashboard();
}


/*
   Google button अभी demo login है।
   Real Google OAuth/Firebase के लिए backend configuration चाहिए।
*/

function demoLogin(){

    localStorage.setItem(
        "topperStudyLoggedIn",
        "true"
    );

    localStorage.setItem(
        "studentEmail",
        "google-user"
    );

    showDashboard();
}


function logout(){

    localStorage.removeItem(
        "topperStudyLoggedIn"
    );

    localStorage.removeItem(
        "studentEmail"
    );

    goBack();

    showLogin();
}


/* =====================================================
   CLASS / SUBJECT
===================================================== */

function changeClass(){

    activeClass =
        document.getElementById("class-select").value;

    updateSubjects();

    goBack();
}


function changeSubject(){

    activeSubject =
        document.getElementById("subject-select").value;

    goBack();
}


function updateSubjects(){

    const select =
        document.getElementById("subject-select");

    select.innerHTML = "";

    let subjects = [];

    if(activeClass === "11"){

        subjects = [
            ["biology","Biology"],
            ["physics","Physics"],
            ["chemistry","Chemistry"]
        ];

    }else if(activeClass === "12"){

        subjects = [
            ["biology","Biology"],
            ["physics","Physics"],
            ["chemistry","Chemistry"]
        ];

    }else{

        subjects = [
            ["science","Science"],
            ["mathematics","Mathematics"]
        ];
    }


    subjects.forEach(function(subject){

        const option =
            document.createElement("option");

        option.value = subject[0];

        option.textContent = subject[1];

        select.appendChild(option);
    });


    if(activeClass === "11"){

        select.value = "biology";

        activeSubject = "biology";

    }else{

        activeSubject = subjects[0][0];

        select.value = activeSubject;
    }
}


/* =====================================================
   LANGUAGE
===================================================== */

function changeLanguage(){

    activeLanguage =
        document.getElementById("language-select").value;

    updateLanguage();
}


function updateLanguage(){

    const hindi =
        activeLanguage === "hi";


    document.getElementById("dashboard-title").textContent =
        hindi
        ? "टॉपर स्टडी हब - NCERT पोर्टल"
        : "Topper Study Hub - NCERT Portal";


    document.getElementById("explore-title").textContent =
        hindi
        ? "श्रेणियाँ देखें"
        : "Explore Categories";


    document.getElementById("notes-title").textContent =
        hindi
        ? "संशोधन नोट्स"
        : "Revision Notes";


    document.getElementById("notes-desc").textContent =
        hindi
        ? "अध्याय-वार सारांश और सूत्र"
        : "Chapter-wise summary & formulas";


    document.getElementById("objective-title").textContent =
        hindi
        ? "वस्तुनिष्ठ प्रश्न"
        : "Objective Questions";


    document.getElementById("objective-desc").textContent =
        hindi
        ? "100 MCQs और तुरंत उत्तर"
        : "100 MCQs with instant answers";


    document.getElementById("subjective-title").textContent =
        hindi
        ? "विषयपरक समाधान"
        : "Subjective Solutions";


    document.getElementById("subjective-desc").textContent =
        hindi
        ? "विस्तृत वर्णनात्मक उत्तर"
        : "Detailed descriptive answers";
}


/* =====================================================
   FOLDER
===================================================== */

function openFolder(type){

    document.getElementById("folders-view").style.display =
        "none";

    document.getElementById("content-view").style.display =
        "block";


    const title =
        document.getElementById("content-title");

    const container =
        document.getElementById("content-container");


    container.innerHTML = "";


    if(
        type === "objective" &&
        activeClass === "11" &&
        activeSubject === "biology"
    ){

        title.textContent =
            activeLanguage === "hi"
            ? "कक्षा 11 जीवविज्ञान — अध्याय 1 — 100 MCQs"
            : "Class 11 Biology — Chapter 1 — 100 MCQs";


        renderQuiz();

        return;
    }


    if(type === "notes"){

        title.textContent =
            activeLanguage === "hi"
            ? "Revision Notes"
            : "Revision Notes";


        container.innerHTML = `
            <div class="empty">
                📝<br><br>
                ${
                    activeLanguage === "hi"
                    ? "इस विषय के Revision Notes जल्द जोड़े जाएंगे।"
                    : "Revision notes for this subject will be added soon."
                }
            </div>
        `;

        return;
    }


    if(type === "subjective"){

        title.textContent =
            activeLanguage === "hi"
            ? "विषयपरक समाधान"
            : "Subjective Solutions";


        container.innerHTML = `
            <div class="empty">
                📖<br><br>
                ${
                    activeLanguage === "hi"
                    ? "इस विषय के Subjective Solutions जल्द जोड़े जाएंगे।"
                    : "Subjective solutions will be added soon."
                }
            </div>
        `;

        return;
    }


    container.innerHTML = `
        <div class="empty">
            Content उपलब्ध नहीं है।
        </div>
    `;
}


/* =====================================================
   BACK
===================================================== */

function goBack(){

    document.getElementById("content-view").style.display =
        "none";

    document.getElementById("folders-view").style.display =
        "block";

    document.getElementById("content-container").innerHTML =
        "";
}


/* =====================================================
   QUIZ
===================================================== */

function renderQuiz(){

    const container =
        document.getElementById("content-container");


    score = 0;
    answered = 0;


    container.innerHTML = `

        <div class="quiz-top">

            <div>
                ${
                    activeLanguage === "hi"
                    ? "सही उत्तर चुनें"
                    : "Choose the correct answer"
                }
            </div>

            <div class="score-box">
                Score: <span id="score">0</span> / 100
            </div>

        </div>

        <div id="quiz-list"></div>

        <div class="quiz-actions">
            <button class="reset-btn" onclick="renderQuiz()">
                🔄 Reset Quiz
            </button>
        </div>
    `;


    const list =
        document.getElementById("quiz-list");


    chapter1Quiz.forEach(function(item,index){

        const card =
            document.createElement("div");

        card.className = "quiz-card";


        const question =
            document.createElement("div");

        question.className = "question";

        question.textContent = item.q;


        const options =
            document.createElement("div");

        options.className = "options";


        item.options.forEach(function(option,index2){

            const button =
                document.createElement("button");

            button.className = "option";

            button.type = "button";

            button.textContent = option;


            button.addEventListener(
                "click",
                function(){

                    answerQuestion(
                        item,
                        index2,
                        options
                    );

                }
            );


            options.appendChild(button);
        });


        card.appendChild(question);

        card.appendChild(options);

        list.appendChild(card);
    });
}


/* =====================================================
   ANSWER
===================================================== */

function answerQuestion(
    item,
    selected,
    optionsContainer
){

    const buttons =
        optionsContainer.querySelectorAll(
            ".option"
        );


    // पहले से answer किया गया है
    if(
        Array.from(buttons).some(
            button => button.disabled
        )
    ){
        return;
    }


    answered++;


    buttons.forEach(function(button){
        button.disabled = true;
    });


    if(selected === item.correct){

        buttons[selected]
            .classList.add("correct");

        score++;

    }else{

        buttons[selected]
            .classList.add("wrong");

        buttons[item.correct]
            .classList.add("correct");
    }


    document.getElementById("score").textContent =
        score;


    // सभी प्रश्न answer होने पर result
    if(answered === chapter1Quiz.length){

        setTimeout(function(){

            alert(
                activeLanguage === "hi"
                ? `Quiz पूरा हुआ!\nआपका Score: ${score}/${chapter1Quiz.length}`
                : `Quiz completed!\nYour Score: ${score}/${chapter1Quiz.length}`
            );

        },300);
    }
}


/* =====================================================
   100 BIOLOGY MCQs
===================================================== */

const chapter1Quiz = [

{
q:"1. 'Systema Naturae' is written by whom? / 'सिस्टेमा नेचुराए' किसके द्वारा लिखी गई है?",
options:[
"Carl Linnaeus (कार्ल लीनियस)",
"Ernst Mayr (अर्नस्ट मेयर)",
"Aristotle (अरस्तू)",
"Theophrastus (थियोफ्रेस्टस)"
],
correct:0
},

{
q:"2. The term 'Biodiversity' was popularized by: / 'जैव विविधता' शब्द को किसने लोकप्रिय बनाया था?",
options:[
"Walter G. Rosen (वाल्टर जी. रोसेन)",
"Edward Wilson (एडवर्ड विल्सन)",
"Alexander von Humboldt (अलेक्जेंडर वॉन हम्बोल्ट)",
"Robert May (रॉबर्ट मे)"
],
correct:1
},

{
q:"3. Basic unit of classification is: / वर्गीकरण की सबसे छोटी इकाई क्या है?",
options:[
"Species (जाति)",
"Genus (वंश)",
"Family (कुल)",
"Order (गण)"
],
correct:0
},

{
q:"4. Binomial nomenclature was given by: / द्विपद नामपद्धति किसने दी थी?",
options:[
"John Ray (जॉन रे)",
"Carolus Linnaeus (कैरोलस लीनियस)",
"Darwin (डार्विन)",
"Lamarck (लामार्च)"
],
correct:1
},

{
q:"5. ICBN stands for: / ICBN का पूरा नाम क्या है?",
options:[
"International Code of Botanical Nomenclature",
"International Congress of Biological Names",
"Indian Code of Botany Nomenclature",
"International Class of Botanical Names"
],
correct:0
},

{
q:"6. Herbarium is a: / हर्बेरियम क्या है?",
options:[
"A garden where live plants are grown",
