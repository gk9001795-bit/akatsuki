<script src="quiz-data.js"></script>
<script src="data.js"></script>
<script>
    let activeFolderType = '';
    let activeSubject = 'science';
    let activeClass = '11';
    let activeLanguage = 'hi';

    // Page load par check karein ki koi error na aaye
    window.addEventListener('DOMContentLoaded', () => {
        try {
            updateDropdowns();
            updateUIText();
        } catch(e) {
            console.log("Data loading check: ", e);
        }
    });

    function loginSuccess() {
        let loginScreen = document.getElementById('login-screen');
        let dashScreen = document.getElementById('dashboard-screen');
        
        if (loginScreen && dashScreen) {
            loginScreen.style.display = 'none';
            dashScreen.style.display = 'block';
        }
        try {
            updateDropdowns();
            updateUIText();
        } catch(e) {}
    }

    function logout() {
        document.getElementById('dashboard-screen').style.display = 'none';
        document.getElementById('login-screen').style.display = 'flex';
    }

    function changeClass(cls) {
        activeClass = cls;
        updateDropdowns();
    }

    function changeSubject(sub) {
        activeSubject = sub;
    }

    function changeLanguage(lang) {
        activeLanguage = lang;
        updateDropdowns();
        updateUIText();
    }

    function updateDropdowns() {
        const subSelect = document.getElementById('subject-select');
        if (!subSelect) return;
        subSelect.innerHTML = '';
        
        if (typeof subjects !== 'undefined' && subjects[activeLanguage]) {
            let subObj = subjects[activeLanguage];
            for (let key in subObj) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerText = subObj[key];
                if(key === activeSubject) opt.selected = true;
                subSelect.appendChild(opt);
            }
        } else {
            let fallback = activeLanguage === 'hi' ? 
                {science: "विज्ञान (Science)", math: "गणित (Mathematics)", history: "इतिहास (History)", geography: "भूगोल (Geography)"} :
                {science: "Science", math: "Mathematics", history: "History", geography: "Geography"};
            for (let key in fallback) {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerText = fallback[key];
                if(key === activeSubject) opt.selected = true;
                subSelect.appendChild(opt);
            }
        }
    }

    function updateUIText() {
        try {
            if (activeLanguage === 'hi') {
                document.getElementById('dash-title').innerText = "टू्पर स्टडी हब - NCERT पोर्टल";
                document.getElementById('explore-title').innerText = "श्रेणियाँ (फोल्डर) देखें";
                document.getElementById('card-notes-title').innerText = "संशोधन नोट्स (Revision Notes)";
                document.getElementById('card-notes-desc').innerText = "अध्याय-वार सारांश और सूत्र";
                document.getElementById('card-obj-title').innerText = "वस्तुनिष्ठ प्रश्न (Objective MCQs)";
                document.getElementById('card-obj-desc').innerText = "इंटरैक्टिव क्विज़ और बहुविकल्पीय प्रश्न";
                document.getElementById('card-sub-title').innerText = "विषयपरक समाधान (Subjective)";
                document.getElementById('card-sub-desc').innerText = "विस्तृत वर्णनात्मक उत्तर";
                document.getElementById('back-btn-text').innerText = "← फोल्डर पर वापस जाएं";
                document.getElementById('logout-btn-text').innerText = "लॉग आउट";
            } else {
                document.getElementById('dash-title').innerText = "Topper Study Hub - NCERT Portal";
                document.getElementById('explore-title').innerText = "EXPLORE CATEGORIES (FOLDERS)";
                document.getElementById('card-notes-title').innerText = "Revision Notes";
                document.getElementById('card-notes-desc').innerText = "Chapter-wise summary & formulas";
                document.getElementById('card-obj-title').innerText = "Objective Questions (MCQs)";
                document.getElementById('card-obj-desc').innerText = "Interactive quizzes & multiple choice";
                document.getElementById('card-sub-title').innerText = "Subjective Solution";
                document.getElementById('card-sub-desc').innerText = "Detailed descriptive answers";
                document.getElementById('back-btn-text').innerText = "← Back to Folders";
                document.getElementById('logout-btn-text').innerText = "Logout";
            }
        } catch(e) {}
    }

    function goBackToFolders() {
        document.getElementById('chapter-view-section').style.display = 'none';
        document.getElementById('main-folders-view').style.display = 'block';
    }

    function openfolder(folderType) {
        activeFolderType = folderType;
        document.getElementById("main-folders-view").style.display = "none";
        document.getElementById("chapter-view-section").style.display = "block";
        
        let container = document.getElementById("chapters-container");
        container.innerHTML = "";

        if (folderType === 'objective') {
            let titleEl = document.getElementById("chapter-view-title");
            let headingText = activeLanguage === 'hi' ? 
                `कक्षा ${activeClass} - अध्याय 1: वस्तुनिष्ठ प्रश्न (1-100 MCQs)` : 
                `Class ${activeClass} - Chapter 1: Objective Questions (1-100 MCQs)`;
            if(titleEl) titleEl.innerText = headingText;

            if (typeof chapter1Quiz !== 'undefined' && Array.isArray(chapter1Quiz)) {
                chapter1Quiz.forEach((item) => {
                    let card = document.createElement('div');
                    card.className = 'chapter-item';
                    card.style.marginBottom = "20px";
                    card.style.padding = "20px";
                    card.style.background = "rgba(15, 23, 42, 0.9)";
                    card.style.borderRadius = "10px";
                    card.style.border = "1px solid #334155";

                    let qTitle = document.createElement('div');
                    qTitle.innerText = item.q;
                    qTitle.style.fontWeight = "600";
                    qTitle.style.fontSize = "15px";
                    qTitle.style.marginBottom = "15px";
                    qTitle.style.color = "#f8fafc";
                    card.appendChild(qTitle);

                    let optionsGrid = document.createElement('div');
                    optionsGrid.style.display = "grid";
                    optionsGrid.style.gridTemplateColumns = "1fr 1fr";
                    optionsGrid.style.gap = "10px";

                    item.options.forEach((opt, optIdx) => {
                        let btn = document.createElement('button');
                        btn.innerText = opt;
                        btn.style.padding = "10px 14px";
                        btn.style.background = "#1e293b";
                        btn.style.border = "1px solid #475569";
                        btn.style.color = "#cbd5e1";
                        btn.style.borderRadius = "6px";
                        btn.style.cursor = "pointer";
                        btn.style.textAlign = "left";
                        btn.style.fontSize = "14px";

                        btn.onclick = function() {
                            let allBtns = optionsGrid.querySelectorAll('button');
                            allBtns.forEach(b => b.disabled = true);

                            if (optIdx === item.correct) {
                                btn.style.background = "#166534";
                                btn.style.borderColor = "#22c55e";
                                btn.style.color = "#fff";
                                feedback.innerText = activeLanguage === 'hi' ? "✅ सही जवाब! (Correct)" : "✅ Correct Answer!";
                                feedback.style.color = "#22c55e";
                            } else {
                                btn.style.background = "#991b1b";
                                btn.style.borderColor = "#ef4444";
                                btn.style.color = "#fff";
                                feedback.innerText = activeLanguage === 'hi' ? 
                                    "❌ गलत जवाब! सही विकल्प यह है: " + item.options[item.correct] : 
                                    "❌ Wrong Answer! Correct option is: " + item.options[item.correct];
                                feedback.style.color = "#ef4444";
                                
                                allBtns[item.correct].style.background = "#166534";
                                allBtns[item.correct].style.borderColor = "#22c55e";
                                allBtns[item.correct].style.color = "#fff";
                            }
                        };
                        optionsGrid.appendChild(btn);
                    });

                    card.appendChild(optionsGrid);

                    let feedback = document.createElement('div');
                    feedback.style.marginTop = "10px";
                    feedback.style.fontSize = "13px";
                    feedback.style.fontWeight = "bold";
                    card.appendChild(feedback);

                    container.appendChild(card);
                });
            } else {
                container.innerHTML = "<p style='color: #ef4444;'>Quiz data load nahi ho paya hai.</p>";
            }
        } else {
            let titleEl = document.getElementById("chapter-view-title");
            if(titleEl) titleEl.innerText = `Class ${activeClass} - Chapter 1 - ${folderType.toUpperCase()}`;
            
            let contentBox = document.createElement('div');
            contentBox.className = 'chapter-item';
            contentBox.innerHTML = `<strong>${folderType.toUpperCase()} Content:</strong><p style="margin-top:10px;">Content for Class ${activeClass}, Subject: ${activeSubject} is loading from data.js...</p>`;
            container.appendChild(contentBox);
        }
    }
</script>
