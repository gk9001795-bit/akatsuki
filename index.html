<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16, #111827);
            min-height: 100vh;
            color: #fff;
        }

        /* Login Screen */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 450px;
        }

        .card h2 {
            margin-bottom: 24px;
            font-size: 26px;
            text-align: center;
            color: #f8fafc;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #6366f1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 25px 40px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dashboard-header h2 {
            color: #6366f1;
            font-size: 24px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        select {
            background: #1e293b;
            color: #fff;
            padding: 8px 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .logout-btn {
            background: #ef4444;
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        /* Class Selector Cards */
        .section-title {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .class-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .class-pill {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            color: #cbd5e1;
            transition: all 0.3s ease;
        }

        .class-pill:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        .class-pill.active {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* Subject Filter */
        .subject-filter {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(30, 41, 59, 0.4);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .subject-filter select {
            padding: 10px 15px;
            font-size: 15px;
            border-radius: 8px;
            background: #0f172a;
            border-color: #334155;
            min-width: 250px;
        }

        /* Folder System */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .folder-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .folder-card:hover {
            transform: translateY(-4px);
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .folder-icon {
            font-size: 36px;
            background: rgba(56, 189, 248, 0.1);
            padding: 15px;
            border-radius: 12px;
        }

        .folder-info h3 {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 6px;
        }

        .folder-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Chapter View */
        .chapter-view {
            display: none;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(8px);
        }

        .back-btn {
            background: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #475569;
        }

        .chapter-title {
            font-size: 20px;
            color: #38bdf8;
            margin-bottom: 20px;
        }

        .chapter-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 20px;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chapter-item:hover {
            border-color: #6366f1;
            background: rgba(15, 23, 42, 0.9);
        }

        .chapter-content-box {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
