<script>
let activeClass = '11';
let activeSubject = '';
let activeLanguage = 'hi';

window.addEventListener('DOMContentLoaded', function () {
    populateSubjectsDropdown();
    updateUIStrings();

    if (localStorage.getItem('isLoggedIn') === 'true') {
        showDashboard();
    }
});

function performLogin() {
    localStorage.setItem('isLoggedIn', 'true');
    showDashboard();
}

function showDashboard() {
    const loginScreen = document.getElementById('login-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');

    loginScreen.style.display = 'none';
    dashboardScreen.style.display = 'block';

    populateSubjectsDropdown();
    updateUIStrings();
}

function performLogout() {
    localStorage.removeItem('isLoggedIn');

    document.getElementById('dashboard-screen').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
}

function onClassChange(value) {
    activeClass = value;
    populateSubjectsDropdown();
}

function onSubjectChange(value) {
    activeSubject = value;
}

function onLanguageChange(value) {
    activeLanguage = value;
    updateUIStrings();
}

function populateSubjectsDropdown() {
    const subSelect = document.getElementById('subject-select');

    if (!subSelect) return;

    subSelect.innerHTML = '';

    const fallback = {
        science: ['Chapter 1'],
        math: ['Chapter 1']
    };

    const classMap =
        (typeof ncertData !== 'undefined' && ncertData[activeClass])
        ? ncertData[activeClass]
        : fallback;

    let firstSubject = '';

    for (const subKey in classMap) {
        if (!firstSubject) {
            firstSubject = subKey;
        }

        const option = document.createElement('option');
        option.value = subKey;
        option.textContent = subKey.toUpperCase();

        subSelect.appendChild(option);
    }

    activeSubject = firstSubject;
}

function updateUIStrings() {
    const hi = activeLanguage === 'hi';

    document.getElementById('dash-title').textContent =
        hi ? 'टॉपर स्टडी हब - NCERT पोर्टल' : 'Topper Study Hub - NCERT Portal';

    document.getElementById('explore-title').textContent =
        hi ? 'श्रेणियाँ (फोल्डर) देखें' : 'EXPLORE CATEGORIES (FOLDERS)';

    document.getElementById('logout-btn-text').textContent =
        hi ? 'लॉग आउट' : 'Logout';
}
</script>
